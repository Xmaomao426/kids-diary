        function loadRecord() {
            const date = document.getElementById('date-select').value;
            const record = records[date];
            
            if (!record) {
                return;
            }
            
            document.getElementById('current-date').textContent = record.date;
            
            const cats = ['schedule', 'food', 'play', 'health', 'other'];
            for (const cat of cats) {
                const el = document.getElementById('cat-' + cat);
                const textEl = document.getElementById('text-' + cat);
                if (record[cat]) {
                    textEl.textContent = record[cat];
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            }
            
            document.getElementById('last-updated').textContent = new Date().toLocaleString('zh-CN');
        }
        
        window.onload = loadRecord;
    </script>
