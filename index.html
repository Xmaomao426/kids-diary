            padding: 20px;
        }

            max-width: 600px;

            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;

        .content { padding: 20px; }
        .day-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        .day-selector select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #667eea;
            border-radius: 12px;
            font-size: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .day-selector select:hover { border-color: #764ba2; }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .stat-item { text-align: center; }
        .stat-number { font-size: 24px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.9; }
        .category {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid;
        }
        .category-schedule { background: #e8f5e9; border-color: #4caf50; }
        .category-food { background: #fff3e0; border-color: #ff9800; }
        .category-activity { background: #e3f2fd; border-color: #2196f3; }
        .category-health { background: #fce4ec; border-color: #e91e63; }
        .category-behavior { background: #f3e5f5; border-color: #9c27b0; }
        .category-family { background: #e0f2f1; border-color: #009688; }
        .category h3 {
            font-size: 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .category p {
            color: #555;
            line-height: 1.8;
            font-size: 14px;
            white-space: pre-line;
        }
        .footer {
            text-align: center;
            padding: 15px;
            color: #999;
            font-size: 12px;
            border-top: 1px solid #eee;
        }
    </style>
</head>

        const DATA_VERSION_LABEL = "2026年7月19日（数据版本）";
        const categories = ['schedule', 'food', 'activity', 'health', 'behavior', 'family'];

        function initializeDiary() {
            const dates = Object.keys(records);
            const dateSelect = document.getElementById('date-select');

            document.getElementById('record-count').textContent = dates.length;
            dateSelect.replaceChildren(...dates.map(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = records[date].date;
                return option;
            }));

            document.getElementById('last-updated').textContent = DATA_VERSION_LABEL;
            loadRecord();
        }
        
        function loadRecord() {
            const date = document.getElementById('date-select').value;
            const record = records[date];
            
            if (!record) {
                return;
            }
            
            document.getElementById('current-date').textContent = record.date;
            
            for (const cat of categories) {
                const el = document.getElementById('cat-' + cat);
                const textEl = document.getElementById('text-' + cat);
                if (record[cat].length > 0) {
                    textEl.textContent = record[cat].map(event => `• ${event}`).join('\n');
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            }
        }
        
        window.addEventListener('DOMContentLoaded', initializeDiary);
    </script>
